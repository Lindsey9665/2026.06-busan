<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>🇰🇷 釜山 BTS ARIRANG 行程</title>
<style>
:root {
  --purple:#7F77DD; --purple-dk:#3C3489; --purple-lt:#EEEDFE; --purple-md:#AFA9EC;
  --bg:#f5f5f7; --card:#fff; --text:#1c1c1e; --sub:#6e6e73; --border:rgba(0,0,0,0.1);
  --green-bg:#E1F5EE; --green-fg:#085041; --blue-bg:#E6F1FB; --blue-fg:#0C447C;
  --red-bg:#FCEBEB; --red-fg:#A32D2D; --amber-bg:#FAC775; --amber-fg:#633806;
  --teal-bg:#EAF3DE; --teal-fg:#3B6D11; --r:12px; --rs:8px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1c1c1e; --card:#2c2c2e; --text:#f5f5f7; --sub:#aeaeb2; --border:rgba(255,255,255,0.12);
    --purple-lt:#26215C; --green-bg:#083028; --green-fg:#5DCAA5; --blue-bg:#0a2a42;
    --blue-fg:#85B7EB; --red-bg:#3a1010; --red-fg:#F09595; --amber-bg:#3a2800;
    --amber-fg:#EF9F27; --teal-bg:#1a2e10; --teal-fg:#97C459; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}

/* Sticky wrapper — header + tabs in ONE block */
.sticky-top{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:.5px solid var(--border)}
/* Header */
.hd{padding:14px 16px 8px}
.hd-title{font-size:17px;font-weight:600}
.hd-sub{font-size:11px;color:var(--sub);margin-top:1px}
.hd-row{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.btn-save{background:var(--purple);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:background .2s}
.btn-save.ok{background:#34C759}
.btn-sm{background:none;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--sub);cursor:pointer}
/* Tabs — inside the same sticky block */
.tabs{display:flex;gap:7px;padding:8px 16px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--sub);white-space:nowrap;transition:all .2s}
.tab.on{background:var(--purple);color:#fff;border-color:var(--purple)}

/* Content */
.pg{padding:12px 16px;max-width:600px;margin:0 auto}

/* Day header */
.dh{background:var(--card);border-radius:var(--r);padding:13px;margin-bottom:10px}
.dbadge{display:inline-block;background:var(--purple);color:#fff;font-size:11px;font-weight:600;padding:2px 10px;border-radius:10px;margin-bottom:5px}
.dtitle{font-size:16px;font-weight:600;margin-bottom:2px}
.dtheme{font-size:12px;color:var(--purple);margin-bottom:3px}
.dhotel{font-size:11px;color:var(--sub)}

/* Plan toggle */
.ptog{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px;border:1px solid var(--border)}
.pbtn{flex:1;padding:7px 6px;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;background:transparent;color:var(--sub);transition:all .2s}
.pbtn.on{background:var(--purple);color:#fff}

/* Item card */
.il{display:flex;flex-direction:column;gap:8px}
.ic{background:var(--card);border-radius:var(--rs);padding:12px;border-left:3px solid var(--purple-md)}
.ic.editing{border:2px solid var(--purple);border-radius:var(--rs)}
.ic-time{font-size:11px;color:var(--sub);font-weight:600;margin-bottom:2px}
.ic-title{font-size:14px;font-weight:600;margin-bottom:4px}
.ic-desc{font-size:12px;color:var(--sub);line-height:1.65;margin-bottom:5px;white-space:pre-line}
.ic-img{width:100%;border-radius:8px;margin-bottom:6px;max-height:200px;object-fit:cover;display:block}
.ic-link{font-size:11px;color:var(--purple);text-decoration:none;display:inline-block;margin-top:1px}
.ia{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.ab{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--sub)}
.ab.ep{color:var(--purple);border-color:var(--purple-md)}
.ab.dp{color:var(--red-fg);border-color:var(--red-bg)}

/* Tags */
.tgs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 5px}
.tg{font-size:10px;font-weight:500;padding:2px 8px;border-radius:8px}
.tg-bts{background:var(--purple-lt);color:var(--purple-dk)}
.tg-star{background:var(--purple);color:#fff}
.tg-ok{background:var(--green-bg);color:var(--green-fg)}
.tg-ok24{background:var(--teal-bg);color:var(--teal-fg)}
.tg-booked{background:#E1F5EE;color:#0A6640;font-weight:600}
.tg-book{background:var(--blue-bg);color:var(--blue-fg)}
.tg-warn{background:var(--red-bg);color:var(--red-fg)}
.tg-cafe{background:var(--amber-bg);color:var(--amber-fg)}
.tg-def{background:var(--bg);color:var(--sub)}

/* Edit form */
.ef{display:flex;flex-direction:column;gap:8px}
.er{display:grid;grid-template-columns:68px 44px 1fr;gap:5px}
.inp{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);width:100%;outline:none;-webkit-appearance:none;font-family:inherit}
.inp:focus{border-color:var(--purple)}
textarea.inp{resize:vertical;line-height:1.5;min-height:68px}
.etgs{display:flex;flex-wrap:wrap;gap:4px;min-height:10px}
.trm{font-size:9px;margin-left:2px;opacity:.7;cursor:pointer}
.tagrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tagrow .inp{flex:1;font-size:12px;min-width:80px}
.color-strip{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.cs{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:transform .15s}
.cs.sel{border-color:var(--text);transform:scale(1.18)}
.tg-custom{font-size:10px;font-weight:500;padding:2px 8px;border-radius:8px}

/* Image section */
.img-section{display:flex;flex-direction:column;gap:6px}
.img-btns{display:flex;gap:6px}
.img-btn{flex:1;padding:9px 6px;border:1.5px dashed var(--border);border-radius:8px;background:transparent;cursor:pointer;font-size:12px;color:var(--sub);text-align:center}
.img-btn:active{background:var(--bg)}
.img-preview{width:100%;border-radius:8px;max-height:180px;object-fit:cover;display:block}
.img-clear{background:var(--red-bg);color:var(--red-fg);border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;align-self:flex-start}

.ea{display:flex;gap:7px;justify-content:flex-end;margin-top:2px}
.bp{background:var(--purple);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer}
.bc{background:none;border:1px solid var(--border);border-radius:10px;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--sub)}

/* Add button */
.add{width:100%;padding:12px;border:1.5px dashed var(--border);border-radius:var(--rs);background:transparent;cursor:pointer;font-size:13px;color:var(--sub);margin-top:6px}
.add:active{background:var(--bg)}

/* Notice */
.notice{background:var(--purple-lt);border-radius:8px;padding:9px 12px;font-size:11px;color:var(--purple-dk);line-height:1.7;margin-bottom:10px}
</style>
</head>

// Return inline style string for a tag (built-in → class, custom → inline)
function tagStyle(t){
  const builtIn = TM[t];

  const pal = PALETTES.find(p=>p.id===(CC[t]||"gray")) || PALETTES[7];
  return `background:${pal.bg};color:${pal.fg}`;
}
function tagClass(t){ return TM[t] ? "tg tg-"+TM[t] : "tg tg-custom"; }

  return `<span class="${tagClass(t)}"${style}>${esc(t)}${rm}</span>`;
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
(function(){
  try {
    const saved = localStorage.getItem("bt4");
    S.days = saved ? JSON.parse(saved).days : JSON.parse(JSON.stringify(INIT.days));
    S.title = saved ? (JSON.parse(saved).title||INIT.title) : INIT.title;
  } catch(e){ S.days = JSON.parse(JSON.stringify(INIT.days)); }
  document.getElementById("hdT").textContent = S.title;
  render();
})();

// ─── Getters/Setters ──────────────────────────────────────────────────────────
function getItems(day){ return day.plan==="AB" ? ((S.plan[day.id]||"A")==="A"?day.planA:day.planB) : (day.items||[]); }
function setItems(dayId,arr){ const d=S.days.find(x=>x.id===dayId); if(d.plan==="AB"){ if((S.plan[dayId]||"A")==="A") d.planA=arr; else d.planB=arr; } else d.items=arr; }
function uid(){ return "u"+Date.now()+Math.random().toString(36).slice(2,5); }

// ─── Render ───────────────────────────────────────────────────────────────────
function render(){ renderTabs(); renderPage(); document.getElementById("hdT").textContent=S.title; }

function renderTabs(){
  document.getElementById("tabs").innerHTML = S.days.map(d=>
    `<button class="tab${d.id===S.day?" on":""}" onclick="gotoDay('${d.id}')">${d.date.split("（")[0]}</button>`
  ).join("");
}

function renderPage(){
  const day = S.days.find(d=>d.id===S.day); if(!day) return;
  const items = getItems(day);
  const plan = S.plan[day.id]||"A";
  let h = `<div class="dh">
    <div class="dbadge">${day.date}</div>
    <div class="dtitle">${esc(day.title)}</div>
    ${day.theme?`<div class="dtheme">${esc(day.theme)}</div>`:""}
    <div class="dhotel">🏨 ${esc(day.hotel)}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <button class="btn-sm" onclick="editDayHd('${day.id}')">✏️ 編輯日標題</button>
    </div>
  </div>`;
  if(day.plan==="AB"){
    h+=`<div class="ptog">
      <button class="pbtn${plan==="A"?" on":""}" onclick="setPlan('${day.id}','A')">Plan A（有票）</button>
      <button class="pbtn${plan==="B"?" on":""}" onclick="setPlan('${day.id}','B')">Plan B（無票）</button>
    </div>`;
  }
  h+=`<div class="il">`;
  items.forEach((item,i)=>{
    h += S.editing===item.id ? renderEdit(item,day.id) : renderCard(item,i,items.length,day.id);
  });
  h+=`</div><button class="add" onclick="addItem('${day.id}')">＋ 新增行程項目</button>`;
  document.getElementById("pg").innerHTML=h;
}

function renderCard(item,idx,total,dayId){
  const tags=item.tags.map(t=>renderTag(t)).join("");
  const img=item.img?`<img class="ic-img" src="${esc(item.img)}" onerror="this.style.display='none'">`:"";
  const lbl=item.naverLink&&item.link===item.naverLink?"📍 Naver 地圖":"🔗 相關連結";
  const link=item.link?`<a class="ic-link" href="${esc(item.link)}" target="_blank">${lbl}</a>`:"";
  const mu=idx>0?`<button class="ab" onclick="moveItem('${dayId}','${item.id}',-1)">↑</button>`:"";
  const md=idx<total-1?`<button class="ab" onclick="moveItem('${dayId}','${item.id}',1)">↓</button>`:"";
  return `<div class="ic">
    <div class="ic-time">${esc(item.time)}</div>
    <div class="ic-title">${esc(item.emoji)} ${esc(item.title)}</div>
    ${item.desc?`<div class="ic-desc">${esc(item.desc)}</div>`:""}
    ${tags?`<div class="tgs">${tags}</div>`:""}
    ${img}${link}
    <div class="ia">${mu}${md}
      <button class="ab ep" onclick="startEdit('${item.id}')">✏️</button>
      <button class="ab dp" onclick="delItem('${dayId}','${item.id}')">🗑</button>
    </div>
  </div>`;
}

function renderEdit(item,dayId){
  const tags=item.tags.map((t,i)=>renderTag(t,`rmTag('${item.id}',${i})`)).join("");
  const dots = PALETTES.map(p=>`<span class="cs${_selColor===p.id?" sel":""}" style="background:${p.dot}" onclick="pickColor('${p.id}')" title="${p.id}"></span>`).join("");
  const imgBlock = item.img
    ? `<div class="img-section">
        <img class="img-preview" src="${esc(item.img)}" onerror="this.style.display='none'" id="ipv">
        <button class="img-clear" onclick="clearImg('${item.id}','${dayId}')">✕ 移除圖片</button>
       </div>`
    : `<div class="img-section">
        <div class="img-btns">
          <button class="img-btn" onclick="pickImg('${item.id}','${dayId}')">📷 從相簿選圖</button>
          <button class="img-btn" onclick="showUrlInput()">🔗 貼圖片網址</button>
        </div>
        <div id="urlRow" style="display:none">
          <input class="inp" id="ef-img" placeholder="https://... 結尾須為 .jpg/.png 等" style="margin-top:6px" oninput="previewUrl(this)">
          <img id="ipv" style="display:none;margin-top:6px" class="img-preview" onerror="this.style.display='none'">
        </div>
       </div>`;
  return `<div class="ic editing">
    <div class="ef">
      <div class="er">
        <input class="inp" id="ef-time" value="${esc(item.time)}" placeholder="時間">
        <input class="inp" id="ef-emoji" value="${esc(item.emoji)}" placeholder="🎯" style="text-align:center">
        <input class="inp" id="ef-title" value="${esc(item.title)}" placeholder="標題">
      </div>
      <textarea class="inp" id="ef-desc" placeholder="說明（支援換行）">${esc(item.desc)}</textarea>
      <div class="etgs" id="etgs">${tags}</div>
      <div class="color-strip" id="cstrip">${dots}</div>
      <div class="tagrow">
        <input class="inp" id="ef-nt" placeholder="新增標籤，先選顏色再點 +" onkeydown="if(event.key==='Enter'){event.preventDefault();addTag('${item.id}')}">
        <button class="bp" style="padding:8px 13px;white-space:nowrap" onclick="addTag('${item.id}')">+</button>
      </div>
      <input class="inp" id="ef-link" value="${esc(item.link)}" placeholder="🔗 Naver 地圖 或相關連結 URL">
      ${imgBlock}
      <div class="ea">
        <button class="bc" onclick="cancelEdit()">取消</button>
        <button class="bp" onclick="saveItem('${dayId}','${item.id}')">✓ 儲存</button>
      </div>
    </div>
  </div>`;
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function gotoDay(id){ S.day=id; S.editing=null; render(); window.scrollTo(0,0); }
function setPlan(dayId,p){ S.plan[dayId]=p; S.editing=null; render(); }
function startEdit(id){ S.editing=id; render(); setTimeout(()=>{ const el=document.querySelector(".ic.editing"); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); },80); }
function cancelEdit(){ S.editing=null; render(); }

function saveItem(dayId,itemId){
  const day=S.days.find(d=>d.id===dayId);
  const items=[...getItems(day)];
  const i=items.findIndex(x=>x.id===itemId); if(i<0) return;
  const urlInp=document.getElementById("ef-img");
  const newImg = urlInp ? urlInp.value.trim() : items[i].img;
  items[i]={...items[i],
    time:document.getElementById("ef-time").value,
    emoji:document.getElementById("ef-emoji").value,
    title:document.getElementById("ef-title").value,
    desc:document.getElementById("ef-desc").value,
    link:document.getElementById("ef-link").value,
    img: S.pendingImg&&S.pendingImg.itemId===itemId ? S.pendingImg.base64 : (newImg||items[i].img)
  };
  setItems(dayId,items);
  S.pendingImg=null; S.editing=null; render();
}

function pickColor(id){
  _selColor = id;
  // re-render just the strip dots
  const strip = document.getElementById("cstrip");
  if(strip) strip.innerHTML = PALETTES.map(p=>`<span class="cs${_selColor===p.id?" sel":""}" style="background:${p.dot}" onclick="pickColor('${p.id}')" title="${p.id}"></span>`).join("");
}

function addTag(itemId){
  const inp=document.getElementById("ef-nt"); const v=inp.value.trim(); if(!v) return;
  const day=S.days.find(d=>d.id===S.day);
  const items=getItems(day); const item=items.find(x=>x.id===itemId);
  if(item){
    item.tags.push(v);
    if(!TM[v]) CC[v]=_selColor; // save colour for custom tags
    saveCC();
    setItems(day.id,items);
  }
  inp.value="";
  const el=document.getElementById("etgs");
  if(el) el.innerHTML=item.tags.map((t,i)=>renderTag(t,`rmTag('${itemId}',${i})`)).join("");
}

function rmTag(itemId,idx){
  const day=S.days.find(d=>d.id===S.day);
  const items=getItems(day); const item=items.find(x=>x.id===itemId);
  if(item){ item.tags.splice(idx,1); setItems(day.id,items); }
  const el=document.getElementById("etgs");
  if(el) el.innerHTML=item.tags.map((t,i)=>renderTag(t,`rmTag('${itemId}',${i})`)).join("");
}

function delItem(dayId,itemId){
  if(!confirm("確定刪除？")) return;
  const day=S.days.find(d=>d.id===dayId);
  setItems(dayId,getItems(day).filter(x=>x.id!==itemId));
  S.editing=null; render();
}

function moveItem(dayId,itemId,dir){
  const day=S.days.find(d=>d.id===dayId);
  const items=[...getItems(day)];
  const i=items.findIndex(x=>x.id===itemId); const to=i+dir;
  if(to<0||to>=items.length) return;
  [items[i],items[to]]=[items[to],items[i]];
  setItems(dayId,items); render();
}

function addItem(dayId){
  const day=S.days.find(d=>d.id===dayId);
  const ni={id:uid(),time:"",emoji:"📌",title:"新行程項目",desc:"",tags:[],link:"",img:""};
  setItems(dayId,[...getItems(day),ni]);
  S.editing=ni.id; render();
  setTimeout(()=>{ const el=document.querySelector(".ic.editing"); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); },80);
}

function editDayHd(dayId){
  const d=S.days.find(x=>x.id===dayId);
  const t=prompt("日期",d.date); if(t!==null) d.date=t;
  const tt=prompt("標題",d.title); if(tt!==null) d.title=tt;
  const th=prompt("主題說明",d.theme); if(th!==null) d.theme=th;
  const h=prompt("住宿",d.hotel); if(h!==null) d.hotel=h;
  render();
}

// ─── Image Handling ───────────────────────────────────────────────────────────
let _pendingItemId="", _pendingDayId="";
function pickImg(itemId,dayId){
  _pendingItemId=itemId; _pendingDayId=dayId;
  document.getElementById("fileImg").click();
}
function handleImgFile(input){
  const file=input.files[0]; if(!file) return;
  // Resize before embedding to keep file size manageable
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const MAX=1200;
      let w=img.width, h=img.height;
      if(w>MAX||h>MAX){ if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);
      const b64=canvas.toDataURL("image/jpeg",0.82);
      S.pendingImg={itemId:_pendingItemId,dayId:_pendingDayId,base64:b64};
      // update preview in edit form
      const pv=document.getElementById("ipv");
      if(pv){ pv.src=b64; pv.style.display="block"; }
      // also update item immediately & save
      const day=S.days.find(d=>d.id===_pendingDayId);
      const items=getItems(day);
      const item=items.find(x=>x.id===_pendingItemId);
      if(item){ item.img=b64; setItems(_pendingDayId,items); render(); }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  input.value="";
}

function clearImg(itemId,dayId){
  const day=S.days.find(d=>d.id===dayId);
  const items=getItems(day);
  const item=items.find(x=>x.id===itemId);
  if(item){ item.img=""; setItems(dayId,items); }
  S.pendingImg=null; render();
}

function showUrlInput(){
  const row=document.getElementById("urlRow");
  if(row) row.style.display="block";
}

function previewUrl(inp){
  const pv=document.getElementById("ipv");
  if(!pv) return;
  if(inp.value){ pv.src=inp.value; pv.style.display="block"; }
  else pv.style.display="none";
}

// ─── Title ────────────────────────────────────────────────────────────────────
function editTitle(){
  document.getElementById("hdText").style.display="none";
  const ea=document.getElementById("hdEdit");
  ea.style.display="flex";
  document.getElementById("hdInp").value=S.title;
  document.getElementById("hdInp").focus();
}
function saveTitle(){
  S.title=document.getElementById("hdInp").value;
  document.getElementById("hdT").textContent=S.title;
  document.getElementById("hdText").style.display="block";
  document.getElementById("hdEdit").style.display="none";
}

// ─── Persist ──────────────────────────────────────────────────────────────────
function saveAll(){
  try{
    localStorage.setItem("bt4",JSON.stringify({title:S.title,days:S.days}));
    const b=document.getElementById("svBtn");
    b.textContent="✓ 已儲存"; b.classList.add("ok");
    setTimeout(()=>{b.textContent="💾 儲存";b.classList.remove("ok");},2000);
  }catch(e){alert("儲存失敗（可能空間不足，圖片太多時請匯出備份）");}
}
function doExport(){
  const blob=new Blob([JSON.stringify({title:S.title,days:S.days},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="busan_trip_backup.json"; a.click();
  URL.revokeObjectURL(a.href);
}
function doImport(){ document.getElementById("fileJSON").click(); }
function handleJSON(input){
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const p=JSON.parse(e.target.result);
      if(p.days){ S.days=p.days; S.title=p.title||S.title; render(); alert("✅ 匯入成功！"); }
      else alert("格式不正確");
    }catch(err){alert("匯入失敗："+err.message);}
  };
  r.readAsText(file); input.value="";
}
</script>
